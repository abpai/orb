name: Release

# Automated npm releases via Changesets, authenticated with OIDC trusted
# publishing. Configure a Trusted Publisher on npmjs.com for @andypai/orb using
# this workflow file; no long-lived NPM_TOKEN secret is required.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run check

      - uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
